<style>
  /* 앱 디자인(lib/ui/theme.dart)과 같은 색·글꼴 규칙: 명조는 운세의 목소리, 나머지는 고딕 */
  :root {
    --surface: #FDF9F1; --card: #FFFFFF; --container: #F1EDE6; --container-high: #ECE8E0;
    --night: #1B1E29; --ink: #1C1C17; --ink-soft: #4E4637; --outline: #7F7665; --outline-variant: #D1C5B2;
    --gold: #795900; --gold-fill: #C9A24A; --gold-light: #FFDF9E; --gold-dim: #EBC165; --on-gold-light: #5B4300;
    --health: #50B8A5; --love: #8B90A3;
    --serif: 'Noto Serif KR', serif;
    --sans: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--surface); color: var(--ink); font-family: var(--sans); letter-spacing: -0.2px; }
  body { -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: anywhere; }
  .page { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; overflow: hidden; overflow: clip; } /* clip: 포커스·스크롤로 옆으로 밀리지 않게 */

  /* 밤하늘 히어로: 달빛 오로라(앱 기본 테마) */
  .hero { position: relative; padding: calc(env(safe-area-inset-top) + 20px) 0 0; color: #FFFFFF; }
  .sky { position: absolute; left: -30%; right: -30%; top: -14%; height: 128%; z-index: 0; pointer-events: none;
         border-radius: 50%; overflow: hidden;
         background: radial-gradient(ellipse at 50% 50%, #111A29 0%, #0E1625 45%, #090E18 70%);
         -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 62%, transparent 100%);
                 mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 62%, transparent 100%); }
  .band { position: absolute; border-radius: 50%; filter: blur(34px); mix-blend-mode: screen; opacity: .95; }
  .b1 { width: 85%; height: 30%; left: 2%; top: 42%; background: rgba(51,112,140,.55); transform: rotate(-14deg); animation: drift1 30s ease-in-out infinite alternate; }
  .b2 { width: 90%; height: 24%; left: 22%; top: 60%; background: rgba(78,76,138,.5); transform: rotate(6deg); animation: drift2 30s ease-in-out infinite alternate; }
  .b3 { width: 60%; height: 26%; left: 35%; top: 30%; background: rgba(120,143,168,.32); transform: rotate(20deg); animation: drift3 30s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(6%, -4%) rotate(-6deg) scale(1.08); } }
  @keyframes drift2 { to { transform: translate(-8%, 3%) rotate(12deg) scale(.95); } }
  @keyframes drift3 { to { transform: translate(-4%, 6%) rotate(28deg) scale(1.1); } }
  .star { position: absolute; border-radius: 50%; background: #DDE6F2; animation: twinkle 4s ease-in-out infinite alternate; }
  @keyframes twinkle { from { opacity: .25; } to { opacity: .95; } }
  @media (prefers-reduced-motion: reduce) { .band, .star { animation: none; } }

  .top { position: relative; z-index: 1; display: flex; align-items: baseline; gap: 6px; padding: 0 20px; }
  .logo { font-family: var(--serif); font-weight: 600; font-size: 20px; letter-spacing: -0.5px; color: #FFFFFF; text-shadow: 0 1px 6px rgba(0,0,0,.35); }
  .logo-hanja { font-family: var(--serif); font-size: 13px; color: var(--gold-dim); }
  .quote-wrap { position: relative; z-index: 1; text-align: center; padding: 28px clamp(40px, 12.5vw, 56px) 64px; }
  .mark { font-family: var(--serif); font-size: 32px; line-height: 1.1; color: rgba(235,193,101,.6); }
  .quote { font-family: var(--serif); font-size: clamp(16px, 4.6vw, 19px); line-height: 1.6; letter-spacing: -0.3px; margin: 4px 0; }
  .meta { margin-top: 18px; font-size: 13px; color: var(--gold-dim); }

  main { position: relative; z-index: 1; padding: 0 20px 40px; }
  .card { background: var(--card); border-radius: 20px; padding: 22px 24px 24px; box-shadow: 0 8px 30px rgba(31,27,22,.06); }
  .row { display: flex; align-items: center; gap: 6px; }
  .label { font-size: 14px; font-weight: 500; }
  .hanja-s { font-family: var(--serif); font-size: 12px; color: var(--outline); }
  .spacer { flex: 1; }
  .pill { font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 999px; color: #fff; }
  .score-row { display: flex; align-items: baseline; margin-top: 16px; }
  .score-xl { font-family: var(--serif); font-weight: 600; font-size: 44px; line-height: 1; letter-spacing: -1px; }
  .unit { font-size: 15px; margin-left: 4px; color: var(--ink-soft); }
  .caption { font-size: 12px; color: var(--outline); }
  .bar { margin-top: 14px; }
  .bar:first-of-type { margin-top: 24px; }
  .bar-head { display: flex; align-items: baseline; gap: 6px; font-size: 13px; color: var(--ink-soft); }
  .bar-head b { font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
  .track { height: 6px; border-radius: 3px; background: var(--container); margin-top: 6px; overflow: hidden; }
  .fill { height: 100%; border-radius: 3px; }

  h2 { font-family: var(--serif); font-weight: 600; font-size: 18px; letter-spacing: -0.7px; margin: 36px 0 12px; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 36px 0 12px; }
  .section-head h2 { margin: 0; }
  .copy-all { background: none; border: 0; padding: 4px 0; font: 500 14px var(--sans); color: var(--gold); cursor: pointer; }
  .head-actions { display: flex; align-items: baseline; gap: 6px; color: var(--outline-variant); font-size: 12px; }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .action { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 14px; padding: 13px 8px;
            background: var(--card); box-shadow: 0 2px 8px rgba(31,27,22,.04); font: 500 14px var(--sans); color: var(--ink); cursor: pointer; }
  .action svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px); transform: translate(-50%, 20px); opacity: 0;
           background: var(--night); color: #fff; font-size: 14px; padding: 12px 18px; border-radius: 12px; transition: .25s; pointer-events: none;
           width: max-content; max-width: calc(100% - 32px); text-align: center; z-index: 10; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 0 20px 4px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1px solid var(--container-high); background: var(--card); color: var(--ink-soft);
          border-radius: 999px; padding: 8px 14px; font: 500 14px var(--sans); cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--night); border-color: var(--night); color: #fff; }
  .detail { margin-top: 16px; }
  .detail-head { display: flex; align-items: baseline; gap: 4px; padding-bottom: 12px; border-bottom: 1px solid var(--container-high); }
  .avg-label { font-size: 13px; color: var(--ink-soft); margin-right: 2px; }
  .avg { font-family: var(--serif); font-weight: 600; font-size: 24px; letter-spacing: -0.5px; }
  .year { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--container); }
  .year:last-child { border-bottom: none; }
  .year.me { background: linear-gradient(90deg, rgba(255,223,158,.35), rgba(255,223,158,0)); margin: 0 -12px; padding: 12px; border-radius: 12px; border-bottom-color: transparent; }
  .year-label { flex: none; width: 52px; font-size: 13px; color: var(--outline); padding-top: 2px; }
  .year-text { font-size: 15px; line-height: 1.5; }
  .year-score { flex: none; font-size: 13px; color: var(--ink-soft); padding-top: 2px; font-variant-numeric: tabular-nums; }

  .app { margin-top: 36px; text-align: center; background: var(--container); border-radius: 20px; padding: 24px 20px; }
  .app img { width: 56px; height: 56px; border-radius: 14px; }
  .app p { margin: 10px 0 0; font-size: 14px; line-height: 1.6; color: var(--ink-soft); }
  .app a { display: inline-block; margin-top: 14px; background: var(--night); color: #fff; text-decoration: none; font-weight: 500; font-size: 14px; padding: 12px 20px; border-radius: 12px; }
  .note { margin-top: 24px; text-align: center; font-size: 12px; line-height: 1.6; color: var(--outline); }
  .msg { text-align: center; padding: 40px 0; font-size: 15px; line-height: 1.6; color: var(--ink-soft); }
  .link { display: block; margin: 16px auto 0; background: none; border: 0; font: 13px var(--sans); color: var(--outline); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

  /* 처음 한 번: 생년월일 입력 */
  .field-label { font-size: 13px; color: var(--ink-soft); }
  .birth { width: 100%; margin-top: 8px; border: 0; border-bottom: 1.5px solid var(--outline-variant); background: none; outline: none;
           font: 600 26px var(--serif); letter-spacing: 1px; padding: 6px 0 10px; color: var(--ink); border-radius: 0; }
  .birth:focus { border-bottom-color: var(--gold-fill); }
  .birth::placeholder { color: var(--container-high); }
  .hint { margin: 10px 0 0; font-size: 13px; color: var(--outline); line-height: 1.5; }
  .hint.error { color: #BA1A1A; }
  .result { display: flex; align-items: center; gap: 16px; margin-top: 22px; }
  .seal { flex: none; width: 56px; height: 56px; border-radius: 50%; background: rgba(255,223,158,.35); color: var(--gold);
          display: flex; align-items: center; justify-content: center; font: 24px var(--serif); }
  .result-title { font: 600 19px var(--serif); letter-spacing: -0.5px; }
  .note-box { margin-top: 16px; padding: 14px; border-radius: 14px; background: rgba(255,223,158,.25); font-size: 13px; line-height: 1.55; color: var(--ink-soft); }
  .note-box b { display: block; font-weight: 500; color: var(--ink); margin-bottom: 4px; font-size: 14px; }
  .choices { display: flex; gap: 8px; margin-top: 12px; }
  .choice { flex: 1; border: 1px solid var(--container-high); background: var(--card); border-radius: 12px; padding: 12px 8px; font: 500 14px var(--sans); color: var(--ink-soft); cursor: pointer; }
  .choice[aria-pressed="true"] { background: var(--night); border-color: var(--night); color: #fff; }
  .primary { width: 100%; margin-top: 24px; border: 0; border-radius: 14px; padding: 16px; background: var(--night); color: #fff; font: 500 16px var(--sans); cursor: pointer; }
  .primary:disabled { background: var(--container-high); color: var(--outline); cursor: default; }
  .privacy { margin: 14px 0 0; text-align: center; font-size: 12px; color: var(--outline); }

  /* 아래 탭(내 운세 모드): 앱처럼 아이콘만 */
  body.tabs .page { padding-bottom: calc(env(safe-area-inset-bottom) + 64px); }
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--container-high);
            padding-bottom: env(safe-area-inset-bottom); }
  .tabbar div { max-width: 480px; margin: 0 auto; display: flex; }
  .tabbar button { flex: 1; height: 52px; border: 0; background: none; color: var(--outline-variant); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .tabbar button[aria-current="page"] { color: var(--ink); }
  .tabbar svg { width: 26px; height: 26px; }

  /* 달력 */
  .plain-top { padding: calc(env(safe-area-inset-top) + 20px) 20px 12px; display: flex; align-items: baseline; gap: 6px; }
  .plain-top .logo { color: var(--ink); text-shadow: none; }
  .plain-top .logo-hanja { color: var(--gold); }
  .cal { padding: 16px; }
  .cal-head { display: flex; align-items: center; }
  .cal-head h3 { flex: 1; margin: 0; text-align: center; font: 600 20px var(--serif); letter-spacing: -0.5px; }
  .nav-btn { width: 40px; height: 40px; border: 0; background: none; border-radius: 50%; color: var(--ink-soft); cursor: pointer; font-size: 22px; line-height: 1; }
  .nav-btn:disabled { color: var(--outline-variant); cursor: default; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px 4px; margin-top: 16px; }
  .wd { text-align: center; font-size: 12px; color: var(--outline); }
  .wd.sun, .d.sun .n { color: #BA1A1A; }
  .wd.sat, .d.sat .n { color: #5A5E6C; }
  .d { height: 48px; border: 0; background: none; border-radius: 12px; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
       gap: 2px; font-family: var(--sans); cursor: pointer; font-variant-numeric: tabular-nums; }
  .d .n { font-size: 15px; font-weight: 500; color: var(--ink); }
  .d .s { font-size: 10px; color: var(--outline); padding: 0 4px; border-radius: 999px; }
  .d.great .s { background: var(--gold-light); color: var(--on-gold-light); font-weight: 500; }
  .d.today { box-shadow: inset 0 0 0 1.2px var(--gold-fill); }
  .d.sel { background: var(--night); box-shadow: 0 2px 8px rgba(31,27,22,.08); }
  .d.sel .n { color: var(--surface); }
  .d.sel .s { background: var(--gold-light); color: var(--on-gold-light); font-weight: 500; }
  .d.empty .n { font-weight: 400; color: var(--outline-variant); }
  .d.future { opacity: .4; cursor: default; }
  .d.future .n { font-weight: 400; color: var(--outline); }
  .d.future svg { width: 12px; height: 12px; stroke: var(--outline); fill: none; stroke-width: 2; }
  .d:disabled { cursor: default; }
  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 12px; margin-top: 12px; font-size: 12px; color: var(--outline); }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .legend i { width: 8px; height: 8px; display: inline-block; border-radius: 2px; }
  .day-card { margin-top: 24px; }
  .day-head { display: flex; align-items: baseline; gap: 8px; }
  .day-head h4 { margin: 0; font: 600 20px var(--serif); letter-spacing: -0.5px; }
  .day-quote { margin: 20px 0 0; padding: 4px 4px 4px 14px; border-left: 2px solid var(--gold-dim); font: 500 16px/1.75 var(--serif); letter-spacing: -0.3px; }
  .domains { display: flex; margin-top: 24px; }
  .domains div { flex: 1; text-align: center; font-size: 12px; color: var(--outline); }
  .domains div + div { border-left: 1px solid var(--container-high); }
  .domains b { display: block; margin-top: 4px; font: 600 24px var(--serif); letter-spacing: -0.5px; }
  hr.rule { border: 0; border-top: 1px solid var(--container-high); margin: 16px 0 0; }

  /* 홈 화면에 추가 안내(아이폰 사파리) */
  .install { margin-top: 16px; display: flex; gap: 12px; align-items: flex-start; background: var(--card); border-radius: 16px; padding: 16px; box-shadow: 0 2px 8px rgba(31,27,22,.04); font-size: 13px; line-height: 1.55; color: var(--ink-soft); }
  .install b { color: var(--ink); font-weight: 500; }
  .install button { flex: none; background: none; border: 0; color: var(--outline); font-size: 18px; line-height: 1; padding: 0 2px; cursor: pointer; }
</style>

  // 서버 주소·공개 키는 배포할 때 채운다(tool/build_share_web.py). 공개 키는 앱에도 들어 있는 읽기 전용 키다.

  const ANIMALS = ['쥐', '소', '호랑이', '토끼', '용', '뱀', '말', '양', '원숭이', '닭', '개', '돼지'];

  const STORE = 'napuri_profile'; // 이 기기에만 저장: { birth: 'YYYY-MM-DD', year: 띠 기준 연도 }

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const twoDigit = (y) => String(y % 100).padStart(2, '0') + '년생';
  const grade = (s) => s >= 85 ? ['대길', '大吉', '#C9A24A'] : s >= 70 ? ['길', '吉', '#D9822B'] : s >= 55 ? ['평', '平', '#7A8B7B'] : ['쉬어감', '息', '#6B7C85'];
  const avg = (xs) => Math.round(xs.reduce((a, b) => a + b, 0) / xs.length);

  function kstToday() {
    const k = new Date(Date.now() + 9 * 3600 * 1000);
    return [k.getUTCFullYear(), k.getUTCMonth() + 1, k.getUTCDate()];
  }
  function dayPillar([y, m, d]) {
    const days = Math.round((Date.UTC(y, m - 1, d) - Date.UTC(2000, 0, 1)) / 86400000);
    const i = ((days + 54) % 60 + 60) % 60;
    return [STEMS[i % 10] + BRANCHES[i % 12], STEM_HANJA[i % 10] + BRANCH_HANJA[i % 12]];
  }
  const yearPillar = (y) => STEMS[((y - 4) % 10 + 10) % 10] + BRANCHES[((y - 4) % 12 + 12) % 12];
  function ganjiHanja(name) {
    if (!name || name.length !== 2) return '';
    const s = STEMS.indexOf(name[0]), b = BRANCHES.indexOf(name[1]);
    return s < 0 || b < 0 ? '' : STEM_HANJA[s] + BRANCH_HANJA[b];
  }

  // 별: 매번 같은 자리에 반짝이도록 고정 난수
  (function stars() {
    let seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const sky = $('sky');
    for (let i = 0; i < 26; i++) {
      const s = document.createElement('i');
      const size = 1 + rnd() * 1.8;
      s.className = 'star';
      s.style.cssText = `width:${size}px;height:${size}px;left:${22 + rnd() * 56}%;top:${30 + rnd() * 50}%;animation-delay:${-rnd() * 4}s;`;

    }
  })();

  // 주소: ?d=2026-10-20&y=1992 (y 가 없으면 그날 12띠 운세)
  const params = new URLSearchParams(location.search);
  const dm = /^(\d{4})-(\d{2})-(\d{2})$/.exec(params.get('d') || '');
  const day = dm ? [+dm[1], +dm[2], +dm[3]] : kstToday();
  const toYmd = (d) => d.map((n, i) => i ? String(n).padStart(2, '0') : n).join('-');

  async function load() {
    const url = `${SUPABASE_URL}/rest/v1/daily_fortunes?select=birth_year,ganji,animal,total,money,health,love,text&date=eq.${ymd}&order=birth_year.desc`;
    const res = await fetch(url, { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } });
    if (!res.ok) throw new Error(res.status);
    return res.json();
  }

  function bar(label, hanja, value, color) {

  }

  function render(rows) {
    const main = $('main');
    const mine = myYear ? rows.find((r) => r.birth_year === myYear) : null;
    $('meta').textContent = `${dateLabel} · ${pillar}일 ${pillarHanja}`;

      html += `<div class="card">
        <div class="row"><span class="label">${mine.birth_year}년생 ${esc(mine.animal)}띠</span><span class="hanja-s">${ganjiHanja(mine.ganji)}</span>

        ${bar('건강운', '健康運', mine.health, 'var(--health)')}
        ${bar('애정운', '愛情運', mine.love, 'var(--love)')}
      </div>
      <div class="actions">
        <button class="action" id="copy-mine"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>복사하기</button>
        <button class="action" id="share-mine"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>공유하기</button>
      </div>`;
    } else if (myYear) {
      $('quote').textContent = '이 연령대의 운세는 준비 중이에요.';
    } else {
      $('quote').textContent = `${dateLabel}, 12띠 운세`;
      document.title = `${dateLabel} 12띠 운세 · 나풀이`;
    }

    // 12띠: 20~89세만, 쥐~돼지 순서
    const board = {};
    for (const r of rows) {
      const age = day[0] - r.birth_year;
      if (age >= MIN_AGE && age <= MAX_AGE) (board[r.animal] ||= []).push(r);
    }
    const order = ANIMALS.filter((a) => board[a]);
    if (order.length) {
      const start = mine && board[mine.animal] ? mine.animal : order[0];
      html += `<div class="section-head"><h2>${mine ? '다른 띠 운세' : '띠별 운세'}</h2><span class="head-actions"><button class="copy-all" id="copy-all">전체 복사</button>·<button class="copy-all" id="share-all">공유</button></span></div>
        <div class="chips" role="group">${order.map((a) => `<button class="chip" data-a="${a}" aria-pressed="${a === start}">${a}</button>`).join('')}</div>
        <div class="detail card" id="detail"></div>`;
    }
    html += installHint() + footer();
    main.innerHTML = html;
    bindFooter();

    const show = (animal) => {
      const list = board[animal];
      document.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', c.dataset.a === animal));
      $('detail').innerHTML = `<div class="detail-head"><span class="label">${animal}띠</span><span class="spacer"></span>
          <span class="avg-label">평균</span><span class="avg">${avg(list.map((r) => r.total))}</span><span class="unit">점</span></div>

    };
    document.querySelectorAll('.chip').forEach((c) => c.addEventListener('click', () => show(c.dataset.a)));
    $('copy-all')?.addEventListener('click', () => copy(boardText(board, order), '12띠 운세를 복사했어요. 원하는 곳에 붙여 넣어 보세요.'));
    $('share-all')?.addEventListener('click', () => share(boardText(board, order), '12띠 운세를 복사했어요. 원하는 곳에 붙여 넣어 보세요.'));
    if (mine) {
      $('copy-mine').addEventListener('click', () => copy(fortuneText(mine), '운세를 복사했어요'));
      $('share-mine').addEventListener('click', () => share(fortuneText(mine), '운세를 복사했어요'));
    }
    if (order.length) {
      const chip = document.querySelector('.chip[aria-pressed="true"]');
      show(chip.dataset.a);

      const row = chip.parentElement;
      row.scrollLeft = chip.offsetLeft - (row.clientWidth - chip.offsetWidth) / 2;
    }
  }

  // 12띠 전체 복사 글: 앱의 boardAsText 와 같은 신문 띠운세 모양
  function boardText(board, order) {
    const sections = order.map((a) => `〈${a}띠〉 운세지수 ${avg(board[a].map((r) => r.total))}점\n`
      + board[a].map((r) => `${twoDigit(r.birth_year)} ${r.text}`).join(' '));
    return `[나풀이] ${dateLabel} 12띠 운세 (${pillar}일)\n\n${sections.join('\n\n')}\n\n`
      + `나풀이의 운세는 명리학을 바탕으로 만든 재미와 참고용 정보예요.\n${pageUrl()}?d=${ymd}`;
  }

  const pageUrl = () => location.origin + location.pathname;

  // 운세 하나 공유 글: 앱의 fortuneShareText 와 같은 모양
  const fortuneText = (f, d = day) => `${f.text}\n\n운세 ${f.total}점 · 금전 ${f.money} · 건강 ${f.health} · 애정 ${f.love}\n\n`
    + `— ${d[1]}월 ${d[2]}일 ${twoDigit(f.birth_year)} ${f.animal}띠 운세 · 나풀이\n${pageUrl()}?d=${toYmd(d)}&y=${f.birth_year}`;

  // 휴대폰 기본 공유 창(아이폰·안드로이드). 지원하지 않는 브라우저면 복사로 대신한다
  async function share(text, copied) {
    if (navigator.share) {
      try { await navigator.share({ text }); } catch {} // 사용자가 닫으면 그냥 끝
      return;
    }
    copy(text, copied);
  }

  async function copy(text, done) {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      // 클립보드 API 가 막힌 브라우저용
      const t = document.createElement('textarea');
      t.value = text; t.setAttribute('readonly', ''); t.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove();
    }
    toast(done);
  }

  function toast(text) {
    let el = document.querySelector('.toast');
    if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
    el.textContent = text;
    requestAnimationFrame(() => el.classList.add('show'));
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => el.classList.remove('show'), 2200);
  }

  function footer() {

    return `<div class="app"><img src="icon.png" alt=""><p>내 생년월일에 맞춘 운세를<br>매일 아침 나풀이에서 받아 보세요.</p>
      <a href="./">${saved ? '내 운세 보기' : '내 운세 보러 가기'}</a><br>${play}</div>${note}`;
  }

  // 아이폰 사파리에서 처음 몇 번: 홈 화면에 추가하면 앱처럼 쓸 수 있다고 알려 준다
  function installHint() {
    const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
    let off = false; try { off = localStorage.getItem('napuri_install_hint') === 'off'; } catch {}
    if (!ios || standalone || shared || off) return '';
    return `<div class="install" id="install"><div><b>홈 화면에 추가해 두세요</b><br>사파리 아래 <b>공유 버튼</b> → <b>홈 화면에 추가</b>를 누르면
      앱처럼 아이콘으로 바로 열려요.</div><button aria-label="닫기" id="install-close">✕</button></div>`;
  }

  function bindFooter() {
    $('reset')?.addEventListener('click', () => { try { localStorage.removeItem(STORE); } catch {} location.replace('./'); });
    $('install-close')?.addEventListener('click', () => {
      try { localStorage.setItem('napuri_install_hint', 'off'); } catch {}
      $('install').remove();
    });
  }

  // ---------- 처음 한 번: 생년월일 입력 ----------
  function resolveYear(y, m, d) {
    const ip = IPCHUN[y];
    if (!ip) return { year: y };
    const [im, id, ih, imin] = ip;
    if (m < im || (m === im && d < id)) return { year: y - 1, before: true };
    if (m > im || d > id) return { year: y };
    return { needsTime: true, time: `${im}월 ${id}일 ${ih}시 ${imin}분` }; // 입춘 당일
  }

        <div id="result"></div>
        <button class="primary" id="save" disabled>내 운세 보기</button>
        <p class="privacy">생년월일은 이 기기에만 저장되고, 서버로 보내지 않아요.</p>
      </div>${installHint()}<p class="note">나풀이의 운세는 명리학을 바탕으로 만든 재미와 참고용 정보예요.<br>© 2026 Napuri</p>`;
    bindFooter();
    const input = $('birth'), hint = $('hint'), result = $('result'), save = $('save');
    let chosen = null, birth = null;

    const showResult = (year, before) => {
      const animal = ANIMALS[((year - 1984) % 12 + 12) % 12];
      const p = yearPillar(year);
      return `<div class="result"><div class="seal">${BRANCH_HANJA[ANIMALS.indexOf(animal)]}</div>
        <div><div class="result-title">${year}년생 ${animal}띠</div><div class="caption">${p}년 <span class="hanja-s">${ganjiHanja(p)}</span></div></div></div>
        ${before ? `<div class="note-box"><b>입춘 전에 태어나 전년도 띠로 봐요</b>명리학에서는 1월 1일이 아니라 입춘(2월 4일 무렵)에 해가 바뀌어요.</div>` : ''}`;
    };

    input.addEventListener('input', () => {
      const digits = input.value.replace(/\D/g, '').slice(0, 8);
      input.value = digits.slice(0, 4) + (digits.length > 4 ? '. ' + digits.slice(4, 6) : '') + (digits.length > 6 ? '. ' + digits.slice(6) : '');
      chosen = birth = null; result.innerHTML = ''; save.disabled = true;
      hint.className = 'hint'; hint.textContent = '숫자 8자리로 적어 주세요. 예) 19920715';
      if (digits.length < 8) return;
      const y = +digits.slice(0, 4), m = +digits.slice(4, 6), d = +digits.slice(6);
      const dt = new Date(Date.UTC(y, m - 1, d));
      const [ty, tm, td] = kstToday();
      if (dt.getUTCMonth() !== m - 1 || dt.getUTCDate() !== d) { hint.className = 'hint error'; hint.textContent = '없는 날짜예요'; return; }
      if (y < 1900 || dt > Date.UTC(ty, tm - 1, td)) { hint.className = 'hint error'; hint.textContent = '1900년부터 오늘까지의 날짜를 입력해 주세요'; return; }
      hint.textContent = '';
      birth = digits.slice(0, 4) + '-' + digits.slice(4, 6) + '-' + digits.slice(6);
      const r = resolveYear(y, m, d);
      if (!r.needsTime) { chosen = r.year; result.innerHTML = showResult(r.year, r.before); save.disabled = false; return; }
      // 입춘 당일: 태어난 시각이 입춘 전인지 후인지 고른다
      result.innerHTML = `<div class="note-box"><b>입춘 당일에 태어나셨네요</b>그해 입춘은 ${r.time}이에요. 태어난 시각에 따라 띠가 달라져요.
        <div class="choices"><button class="choice" data-y="${y - 1}">입춘 전</button><button class="choice" data-y="${y}">입춘 후</button></div></div><div id="picked"></div>`;
      result.querySelectorAll('.choice').forEach((b) => b.addEventListener('click', () => {
        result.querySelectorAll('.choice').forEach((c) => c.setAttribute('aria-pressed', c === b));
        chosen = +b.dataset.y; $('picked').innerHTML = showResult(chosen, false); save.disabled = false;
      }));
    });
    save.addEventListener('click', () => {
      if (!chosen) return;
      try { localStorage.setItem(STORE, JSON.stringify({ birth, year: chosen })); } catch {}
      location.replace('./');
    });
  }

  // ---------- 달력(내 운세 모드) ----------
  const cal = { month: [kstToday()[0], kstToday()[1]], selected: null, cache: {}, first: undefined };
  const api = (q) => fetch(`${SUPABASE_URL}/rest/v1/daily_fortunes?${q}`, { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } })
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });
  const same = (a, b) => a && b && a[0] === b[0] && a[1] === b[1] && a[2] === b[2];
  const after = (a, b) => Date.UTC(a[0], a[1] - 1, a[2]) > Date.UTC(b[0], b[1] - 1, b[2]);
  const icon = {
    copy: '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>',
    share: '<svg viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>',
    lock: '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  };

  async function monthData([y, m]) {
    const key = `${y}-${m}`;
    if (!cal.cache[key]) {
      const last = new Date(Date.UTC(y, m, 0)).getUTCDate();
      const rows = await api(`select=date,birth_year,ganji,animal,total,money,health,love,text&birth_year=eq.${saved.year}`
        + `&date=gte.${toYmd([y, m, 1])}&date=lte.${toYmd([y, m, last])}&order=date`);
      const today = kstToday(), map = {};
      for (const r of rows) {
        const d = r.date.split('-').map(Number);
        if (!after(d, today)) map[d[2]] = r; // 서버는 내일까지 주지만 달력은 오늘까지만(앱과 같다)
      }
      cal.cache[key] = map;
    }
    return cal.cache[key];
  }

  async function showCalendar() {
    const el = $('calendar');
    if (cal.first === undefined) {
      try {
        const r = await api(`select=date&birth_year=eq.${saved.year}&order=date&limit=1`);
        cal.first = r.length ? r[0].date.split('-').map(Number) : null;
      } catch { cal.first = null; }
    }
    const [y, m] = cal.month;
    const today = kstToday();
    let days;
    try { days = await monthData(cal.month); } catch { days = null; }
    const nums = days ? Object.keys(days).map(Number) : [];
    if (!cal.selected || cal.selected[0] !== y || cal.selected[1] !== m || !days?.[cal.selected[2]]) {
      cal.selected = days?.[today[2]] && y === today[0] && m === today[1] ? today : nums.length ? [y, m, Math.max(...nums)] : null;
    }
    const canPrev = cal.first && (y > cal.first[0] || (y === cal.first[0] && m > cal.first[1]));
    const canNext = y < today[0] || (y === today[0] && m < today[1]);

    const lead = new Date(Date.UTC(y, m - 1, 1)).getUTCDay();
    const count = new Date(Date.UTC(y, m, 0)).getUTCDate();
    let cells = WEEK.map((w, i) => `<div class="wd${i === 0 ? ' sun' : i === 6 ? ' sat' : ''}">${w}</div>`).join('');
    cells += '<div></div>'.repeat(lead);
    for (let d = 1; d <= count; d++) {
      const date = [y, m, d], wd = (lead + d - 1) % 7;
      const cls = wd === 0 ? ' sun' : wd === 6 ? ' sat' : '';
      const f = days?.[d];
      if (after(date, today)) cells += `<button class="d future" disabled aria-label="${m}월 ${d}일 잠김"><span class="n">${d}</span>${icon.lock}</button>`;
      else if (!f) cells += `<button class="d empty${cls}" disabled><span class="n">${d}</span></button>`;
      else cells += `<button class="d${cls}${f.total >= 85 ? ' great' : ''}${same(date, today) ? ' today' : ''}${same(date, cal.selected) ? ' sel' : ''}"
        data-d="${d}" aria-label="${m}월 ${d}일 ${f.total}점"><span class="n">${d}</span><span class="s">${f.total}</span></button>`;
    }

    let detail = '';
    if (!days) {
      detail = `<div class="card day-card"><p class="msg" style="padding:8px 0">운세를 불러오지 못했어요.<br>인터넷 연결을 확인한 뒤 다시 열어 주세요.</p></div>`;
    } else if (cal.selected) {
      const s = cal.selected, f = days[s[2]];
      const [g] = grade(f.total), gc = grade(f.total)[2];
      const [p, ph] = dayPillar(s);
      detail = `<div class="card day-card">
          <div class="day-head"><h4>${s[1]}월 ${s[2]}일</h4><span class="caption">${WEEK[new Date(Date.UTC(s[0], s[1] - 1, s[2])).getUTCDay()]}요일</span>
            <span class="spacer"></span><span class="pill" style="background:${gc}">${g} · ${f.total}점</span></div>
          <div class="caption" style="margin-top:6px">${p}일 <span class="hanja-s">${ph}日</span></div>
          <hr class="rule">
          <p class="day-quote">“${esc(f.text)}”</p>
          <div class="domains"><div>금전<b style="color:#9A7A37">${f.money}</b></div><div>건강<b style="color:#006B5D">${f.health}</b></div><div>애정<b style="color:#5A5E6C">${f.love}</b></div></div>
        </div>
        <div class="actions"><button class="action" id="copy-day">${icon.copy}복사하기</button><button class="action" id="share-day">${icon.share}공유하기</button></div>`;
    } else {
      detail = `<div class="card day-card"><p class="msg" style="padding:8px 0">이 달에는 볼 수 있는 운세가 없어요.</p></div>`;
    }

    el.innerHTML = `<div class="plain-top"><span class="logo">나풀이</span><span class="logo-hanja">命理</span></div>
      <div style="padding:8px 20px 24px">
        <div class="card cal">
          <div class="cal-head"><button class="nav-btn" id="prev" aria-label="이전 달" ${canPrev ? '' : 'disabled'}>‹</button>
            <h3>${y}년 ${m}월</h3><button class="nav-btn" id="next" aria-label="다음 달" ${canNext ? '' : 'disabled'}>›</button></div>
          <div class="grid">${cells}</div>
          <div class="legend"><span><i style="background:var(--gold-dim);border-radius:50%"></i>대길(85점+)</span><span><i style="background:var(--night)"></i>선택한 날</span>
            <span><i style="box-shadow:inset 0 0 0 1.2px var(--gold-fill)"></i>오늘</span><span>${icon.lock.replace('<svg', '<svg style="width:12px;height:12px;stroke:var(--outline);fill:none;stroke-width:2"')}미래 잠금</span></div>
        </div>
        ${detail}
        <p class="note">나풀이의 운세는 명리학을 바탕으로 만든 재미와 참고용 정보예요.</p>
      </div>`;
    const go = (delta) => { const t = new Date(Date.UTC(y, m - 1 + delta, 1)); cal.month = [t.getUTCFullYear(), t.getUTCMonth() + 1]; cal.selected = null; showCalendar(); };
    $('prev').addEventListener('click', () => go(-1));
    $('next').addEventListener('click', () => go(1));
    el.querySelectorAll('.d[data-d]').forEach((b) => b.addEventListener('click', () => { cal.selected = [y, m, +b.dataset.d]; showCalendar(); }));
    if (cal.selected && days) {
      const f = days[cal.selected[2]], s = cal.selected;
      $('copy-day').addEventListener('click', () => copy(fortuneText(f, s), '운세를 복사했어요'));
      $('share-day').addEventListener('click', () => share(fortuneText(f, s), '운세를 복사했어요'));
    }
  }

  // 탭 전환: 주소 끝 #calendar (뒤로 가기로 오늘 운세로 돌아온다)
  function route() {
    const calView = location.hash === '#calendar';
    document.querySelector('.hero').hidden = $('main').hidden = calView;
    $('calendar').hidden = !calView;
    document.querySelectorAll('.tabbar button').forEach((b) => b.toggleAttribute('aria-current', false));
    document.querySelector(`.tabbar button[data-view="${calView ? 'calendar' : ''}"]`).setAttribute('aria-current', 'page');
    if (calView) showCalendar();
    window.scrollTo(0, 0);
  }

  if (!shared && saved) {
    document.body.classList.add('tabs');
    $('tabbar').hidden = false;
    document.querySelectorAll('.tabbar button').forEach((b) => b.addEventListener('click', () => {
      const target = b.dataset.view ? '#' + b.dataset.view : location.pathname;
      if ((location.hash === '#calendar') !== !!b.dataset.view) history.pushState(null, '', target), route();
    }));
    addEventListener('popstate', route);
    route();
  }

  if (!shared && !saved) {
    setup();
  } else {
    load().then(render).catch(() => {
      $('meta').textContent = dateLabel;
      $('quote').textContent = '운세를 불러오지 못했어요.';
      $('main').innerHTML = `<p class="msg">인터넷 연결을 확인한 뒤<br>다시 열어 주세요.</p>${footer()}`;
      bindFooter();
    });
  }
  // 홈 화면 아이콘으로 띄워 둔 채 날짜가 바뀌면(다음 날 아침) 오늘 운세로 새로 고친다
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && !params.has('d') && kstToday().join() !== day.join()) location.reload();
  });
</script>
</body>
</html>
